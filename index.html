    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

  <body class="bg-[#F8F7F5] text-[#1A1A1A] antialiased selection:bg-[#8B6B4D]/20 selection:text-[#1A1A1A]">
    <div id="root">
      <div style="position:fixed;inset:0;background-color:#121110;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F8F7F5;font-family:'Plus Jakarta Sans',sans-serif;z-index:9999;">
        <div style="position:relative;margin-bottom:28px;display:flex;align-items:center;justify-content:center;">
          <div style="width:76px;height:76px;border-radius:50%;border:1px dashed rgba(201,181,150,0.35);animation:spin 14s linear infinite;position:absolute;"></div>
          <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#2A2621,#141210);border:1px solid rgba(201,181,150,0.6);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
            <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:700;color:#E8D9C5;">A</span>
          </div>
        </div>
        <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;letter-spacing:0.22em;margin:0 0 6px 0;color:#F8F7F5;font-weight:500;">AURA &amp; FORMA</h1>
        <p style="font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:#C9B596;margin:0 0 28px 0;font-weight:300;">Atelier Copenhagen &bull; Est. 2018</p>
        <div style="width:200px;height:2px;background:rgba(255,255,255,0.12);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;left:0;width:50%;background:linear-gradient(90deg,#8B6B4D,#C9B596,#EAE0D3);border-radius:999px;animation:pulseBar 1.6s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes spin { 100% { transform: rotate(360deg); } }
          @keyframes pulseBar {
            0% { left: -50%; width: 50%; }
            50% { left: 25%; width: 60%; }
            100% { left: 100%; width: 50%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
